<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background: #0a0a0a;
    }

    .above-fold {
      height: 100vh;
    }

    .below-fold {
      display: flex;
      justify-content: center;
      padding: 4rem 2rem;
    }

    .cards {
      display: flex;
      flex-direction: row;
      gap: 2rem;
    }

    .card {
      width: 45vw;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      border-radius: 32px;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <div class="above-fold"></div>

  <div class="below-fold">
    <div class="cards">
      <div class="card">
        <img src="one-piece-1.jpg" alt="Project 1">
      </div>
      <div class="card">
        <img src="one-piece-2.jpg" alt="Project 2">
      </div>
    </div>
  </div>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: ".cards",
        start: "top 85%",
        toggleActions: "play none none none"
      }
    });

    tl.fromTo(".card",
      { clipPath: "inset(5% 65% 50% 5% round 32px)" },
      { clipPath: "inset(0% 0% 0% 0% round 32px)", duration: 0.85, ease: "power2.out", stagger: 0.15 }
    ).fromTo(".card img",
      { scale: 1.15 },
      { scale: 1, duration: 0.85, ease: "power2.out", stagger: 0.15 },
      "<"
    );
  </script>
</body>
</html>
