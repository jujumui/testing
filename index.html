<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
    }

    .cards {
      display: flex;
      flex-direction: row;
      gap: 2rem;
    }

    .card {
      width: 45vw;
      aspect-ratio: 16 / 10;
      overflow: hidden;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <div class="cards">
    <div class="card">
      <img src="one-piece-1.jpg" alt="Project 1">
    </div>
    <div class="card">
      <img src="one-piece-2.jpg" alt="Project 2">
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      gsap.from(".card", {
        clipPath: "inset(50% 0% 50% 0%)",
        rotateX: 6,
        transformPerspective: 1000,
        duration: 1.2,
        ease: "expo.out",
        stagger: 0.15
      });

      gsap.from(".card img", {
        scale: 1.25,
        y: 40,
        duration: 1.2,
        ease: "expo.out",
        stagger: 0.15
      });
    });
  </script>
</body>
</html>
